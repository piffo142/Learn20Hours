<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f3f0e8">
  <title>Daymark — a little more deliberate</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f3f0e8;
      --paper-deep: #e8e4d9;
      --ink: #25271f;
      --muted: #77786d;
      --line: #d8d4c9;
      --green: #344f3c;
      --green-soft: #e3e9df;
      --orange: #cc5b3d;
      --white: #fbfaf6;
      --serif: "Iowan Old Style", "Palatino Linotype", "Book Antiqua", Georgia, serif;
      --sans: "Avenir Next", Avenir, "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background:
        radial-gradient(ellipse at 12% 18%, rgba(255,255,255,.68), transparent 31rem),
        repeating-linear-gradient(0deg, transparent 0 5px, rgba(68,62,45,.018) 6px),
        var(--paper);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }

    button, input { font: inherit; }
    button { color: inherit; }

    .page {
      width: min(100% - 48px, 1100px);
      margin: 0 auto;
    }

    .masthead {
      min-height: 74px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid var(--line);
    }

    .brand {
      display: inline-flex;
      gap: 10px;
      align-items: center;
      font-size: 13px;
      font-weight: 750;
      letter-spacing: .13em;
      text-transform: uppercase;
    }

    .brand-mark {
      display: grid;
      width: 27px;
      height: 27px;
      place-items: center;
      color: var(--paper);
      background: var(--green);
      border-radius: 50% 50% 50% 7px;
      transform: rotate(-8deg);
    }

    .brand-mark svg { transform: rotate(8deg); }

    .edition {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    main {
      display: grid;
      grid-template-columns: minmax(220px, .78fr) minmax(0, 1.4fr);
      gap: clamp(42px, 9vw, 120px);
      padding: clamp(54px, 9vh, 92px) 0 80px;
    }

    .intro { padding-top: 9px; }

    .eyebrow {
      display: flex;
      gap: 10px;
      align-items: center;
      color: var(--orange);
      font-size: 10px;
      font-weight: 750;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow::before {
      width: 23px;
      height: 1px;
      content: "";
      background: currentColor;
    }

    h1 {
      max-width: 430px;
      margin: 23px 0 18px;
      font-family: var(--serif);
      font-size: clamp(52px, 7.2vw, 86px);
      font-weight: 500;
      letter-spacing: -.065em;
      line-height: .92;
    }

    h1 em {
      color: var(--green);
      font-weight: 500;
    }

    .date {
      margin: 25px 0 0;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 17px;
      font-style: italic;
    }

    .note {
      max-width: 250px;
      margin-top: 57px;
      padding-top: 15px;
      border-top: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--serif);
      font-size: 15px;
      line-height: 1.55;
    }

    .note strong {
      display: block;
      margin-bottom: 6px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 9px;
      letter-spacing: .14em;
      text-transform: uppercase;
    }

    .board {
      min-width: 0;
      padding: clamp(23px, 4vw, 42px);
      background: rgba(251, 250, 246, .76);
      border: 1px solid rgba(216, 212, 201, .8);
      box-shadow: 0 18px 55px rgba(54, 48, 33, .055), 0 2px 5px rgba(54, 48, 33, .025);
      animation: arrive .55s ease-out both;
    }

    @keyframes arrive {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .board-top {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      padding-bottom: 17px;
      border-bottom: 1px solid var(--line);
    }

    .board-top h2 {
      margin: 0;
      font-family: var(--serif);
      font-size: 25px;
      font-weight: 500;
      letter-spacing: -.035em;
    }

    .task-count {
      color: var(--muted);
      font-size: 10px;
      font-weight: 650;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .task-form {
      display: flex;
      margin: 23px 0 20px;
      border-bottom: 1px solid var(--ink);
    }

    .task-form input {
      width: 100%;
      min-width: 0;
      padding: 12px 2px 14px;
      color: var(--ink);
      background: transparent;
      border: 0;
      outline: 0;
      font-family: var(--serif);
      font-size: 17px;
    }

    .task-form input::placeholder { color: #a5a397; }

    .add-button {
      display: grid;
      flex: 0 0 36px;
      width: 36px;
      height: 36px;
      margin: 4px 0 5px 10px;
      place-items: center;
      color: var(--white);
      background: var(--green);
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      transition: transform .18s ease, background .18s ease;
    }

    .add-button:hover { background: #243b2c; transform: rotate(90deg); }
    .add-button:focus-visible, .filter:focus-visible, .delete-button:focus-visible,
    .check:focus-visible, .clear-button:focus-visible, input:focus-visible {
      outline: 2px solid var(--orange);
      outline-offset: 3px;
    }

    .tools {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 8px;
    }

    .filters { display: flex; gap: 4px; }

    .filter, .clear-button {
      padding: 6px 9px;
      background: transparent;
      border: 0;
      color: var(--muted);
      cursor: pointer;
      font-size: 10px;
      font-weight: 650;
      transition: color .18s ease, background .18s ease;
    }

    .filter { border-radius: 20px; }
    .filter:hover, .clear-button:hover { color: var(--ink); }
    .filter[aria-pressed="true"] { color: var(--green); background: var(--green-soft); }
    .clear-button { padding-right: 0; }

    .task-list {
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .task-item {
      display: grid;
      grid-template-columns: 22px minmax(0, 1fr) 30px;
      gap: 12px;
      align-items: center;
      min-height: 58px;
      border-bottom: 1px solid var(--line);
      animation: task-in .24s ease-out both;
    }

    @keyframes task-in {
      from { opacity: 0; transform: translateY(4px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .check {
      display: grid;
      width: 19px;
      height: 19px;
      padding: 0;
      place-items: center;
      background: transparent;
      border: 1px solid #aaa99d;
      border-radius: 50%;
      cursor: pointer;
      transition: background .15s ease, border-color .15s ease, transform .15s ease;
    }

    .check:hover { border-color: var(--green); transform: scale(1.08); }
    .check svg { display: none; }
    .task-item.is-complete .check { background: var(--green); border-color: var(--green); }
    .task-item.is-complete .check svg { display: block; }

    .task-text {
      overflow-wrap: anywhere;
      font-family: var(--serif);
      font-size: 16px;
      line-height: 1.4;
      transition: color .2s ease;
    }

    .task-item.is-complete .task-text {
      color: #9b9b90;
      text-decoration: line-through;
      text-decoration-color: #b0b1a5;
    }

    .delete-button {
      display: grid;
      width: 28px;
      height: 28px;
      padding: 0;
      place-items: center;
      color: #99998e;
      background: transparent;
      border: 0;
      border-radius: 50%;
      cursor: pointer;
      opacity: 0;
      transition: color .15s ease, background .15s ease, opacity .15s ease;
    }

    .task-item:hover .delete-button, .delete-button:focus-visible { opacity: 1; }
    .delete-button:hover { color: var(--orange); background: #f5e8e2; }

    .empty-state {
      padding: 35px 10px 27px;
      color: var(--muted);
      font-family: var(--serif);
      font-size: 16px;
      font-style: italic;
      text-align: center;
    }

    .board-foot {
      display: flex;
      justify-content: space-between;
      gap: 16px;
      padding-top: 16px;
      color: var(--muted);
      font-size: 9px;
      letter-spacing: .08em;
      text-transform: uppercase;
    }

    .board-foot span:last-child { color: var(--green); }

    @media (max-width: 700px) {
      .page { width: min(100% - 36px, 520px); }
      .masthead { min-height: 62px; }
      main {
        grid-template-columns: 1fr;
        gap: 32px;
        padding: 48px 0 56px;
      }
      .intro { padding-top: 0; }
      h1 { margin: 18px 0 13px; font-size: clamp(56px, 15vw, 78px); }
      .date { margin-top: 17px; }
      .note { display: none; }
      .board { padding: 23px 20px; }
    }

    @media (max-width: 390px) {
      .page { width: calc(100% - 28px); }
      .board { padding-inline: 16px; }
      .task-item { gap: 9px; }
      .edition { font-size: 9px; }
    }

    @media (hover: none) {
      .delete-button { opacity: 1; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        animation-duration: .01ms !important;
        animation-iteration-count: 1 !important;
        transition-duration: .01ms !important;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <div class="brand">
        <span class="brand-mark" aria-hidden="true">
          <svg width="15" height="15" viewBox="0 0 20 20" fill="none">
            <path d="M5 13.8c2.4-1.1 5.7-4.4 7-8.6 2.2 3.3 2.8 7.2 1.3 9.1-1.7 2.2-5.5 1.7-8.3-.5Z" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M4 16c2.4-2.6 4.5-4.1 7.5-5.5" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/>
          </svg>
        </span>
        Daymark
      </div>
      <div class="edition">A little more deliberate</div>
    </header>

    <main>
      <section class="intro" aria-labelledby="page-title">
        <div class="eyebrow">Your daily page</div>
        <h1 id="page-title">Make room<br>for <em>today.</em></h1>
        <p class="date" id="today-date"></p>
        <div class="note">
          <strong>A small reminder</strong>
          Progress has a quieter sound than you think.
        </div>
      </section>

      <section class="board" aria-labelledby="list-heading">
        <div class="board-top">
          <h2 id="list-heading">The list</h2>
          <span class="task-count" id="task-count" aria-live="polite"></span>
        </div>

        <form class="task-form" id="task-form">
          <label for="task-input" class="visually-hidden">Add a task</label>
          <input id="task-input" name="task" type="text" maxlength="200" placeholder="What needs doing?" autocomplete="off" required>
          <button class="add-button" type="submit" aria-label="Add task">
            <svg width="16" height="16" viewBox="0 0 16 16" fill="none" aria-hidden="true">
              <path d="M8 3v10M3 8h10" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
            </svg>
          </button>
        </form>

        <div class="tools">
          <div class="filters" role="group" aria-label="Filter tasks">
            <button class="filter" type="button" data-filter="all" aria-pressed="true">All</button>
            <button class="filter" type="button" data-filter="active" aria-pressed="false">To do</button>
            <button class="filter" type="button" data-filter="completed" aria-pressed="false">Done</button>
          </div>
          <button class="clear-button" id="clear-completed" type="button">Clear done</button>
        </div>

        <ul class="task-list" id="task-list" aria-label="Tasks"></ul>
        <div class="board-foot">
          <span id="remaining-count"></span>
          <span>One thing at a time</span>
        </div>
      </section>
    </main>
  </div>

  <style>
    .visually-hidden {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>

  <script>
    (() => {
      const STORAGE_KEY = "daymark.tasks.v1";
      const form = document.querySelector("#task-form");
      const input = document.querySelector("#task-input");
      const list = document.querySelector("#task-list");
      const count = document.querySelector("#task-count");
      const remainingCount = document.querySelector("#remaining-count");
      const clearButton = document.querySelector("#clear-completed");
      const filterButtons = [...document.querySelectorAll(".filter")];
      const dateElement = document.querySelector("#today-date");
      let filter = "all";
      let tasks = loadTasks();

      function loadTasks() {
        try {
          const saved = localStorage.getItem(STORAGE_KEY);
          if (!saved) return [];
          const parsed = JSON.parse(saved);
          if (!Array.isArray(parsed)) throw new Error("Saved task data is not a list.");
          return parsed.filter(task =>
            task &&
            typeof task.id === "string" &&
            typeof task.text === "string" &&
            typeof task.completed === "boolean"
          );
        } catch (error) {
          console.error("Daymark could not load saved tasks.", error);
          return [];
        }
      }

      function saveTasks() {
        try {
          localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
        } catch (error) {
          console.error("Daymark could not save tasks to local storage.", error);
          window.alert("Your changes could not be saved in this browser. Check your storage settings and try again.");
        }
      }

      function render() {
        const visibleTasks = tasks.filter(task =>
          filter === "all" ||
          (filter === "active" && !task.completed) ||
          (filter === "completed" && task.completed)
        );
        const remaining = tasks.filter(task => !task.completed).length;
        const completed = tasks.length - remaining;

        count.textContent = `${tasks.length} ${tasks.length === 1 ? "task" : "tasks"}`;
        remainingCount.textContent = `${remaining} ${remaining === 1 ? "left" : "left to do"}`;
        clearButton.hidden = completed === 0;
        filterButtons.forEach(button => {
          button.setAttribute("aria-pressed", String(button.dataset.filter === filter));
        });
        list.replaceChildren();

        if (visibleTasks.length === 0) {
          const empty = document.createElement("li");
          empty.className = "empty-state";
          empty.textContent = tasks.length === 0
            ? "A blank page is full of possibility."
            : filter === "active"
              ? "Nothing left on this list. Nicely done."
              : "No finished tasks just yet.";
          list.append(empty);
          return;
        }

        visibleTasks.forEach(task => {
          const item = document.createElement("li");
          item.className = `task-item${task.completed ? " is-complete" : ""}`;

          const check = document.createElement("button");
          check.type = "button";
          check.className = "check";
          check.setAttribute("aria-label", `${task.completed ? "Mark as to do" : "Complete"}: ${task.text}`);
          check.setAttribute("aria-pressed", String(task.completed));
          check.innerHTML = '<svg width="12" height="12" viewBox="0 0 12 12" fill="none" aria-hidden="true"><path d="m2.2 6.2 2.3 2.3 5.3-5" stroke="white" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>';
          check.addEventListener("click", () => {
            task.completed = !task.completed;
            saveTasks();
            render();
          });

          const text = document.createElement("span");
          text.className = "task-text";
          text.textContent = task.text;

          const remove = document.createElement("button");
          remove.type = "button";
          remove.className = "delete-button";
          remove.setAttribute("aria-label", `Delete: ${task.text}`);
          remove.innerHTML = '<svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><path d="m4.5 4.5 7 7m0-7-7 7" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
          remove.addEventListener("click", () => {
            tasks = tasks.filter(candidate => candidate.id !== task.id);
            saveTasks();
            render();
          });

          item.append(check, text, remove);
          list.append(item);
        });
      }

      form.addEventListener("submit", event => {
        event.preventDefault();
        const text = input.value.trim();
        if (!text) {
          input.focus();
          return;
        }
        tasks.unshift({
          id: globalThis.crypto?.randomUUID?.() ?? `${Date.now()}-${Math.random().toString(36).slice(2)}`,
          text,
          completed: false
        });
        saveTasks();
        input.value = "";
        filter = "all";
        render();
        input.focus();
      });

      filterButtons.forEach(button => {
        button.addEventListener("click", () => {
          filter = button.dataset.filter;
          render();
        });
      });

      clearButton.addEventListener("click", () => {
        tasks = tasks.filter(task => !task.completed);
        saveTasks();
        render();
      });

      dateElement.textContent = new Intl.DateTimeFormat(undefined, {
        weekday: "long",
        month: "long",
        day: "numeric"
      }).format(new Date());
      render();
    })();
  </script>
</body>
</html>
